name: Dispatch Monday quote

# One-shot helper. The cloud agent token cannot call workflow_dispatch.
# GITHUB_TOKEN can. This file is removed after it dispatches Daily Quote Tweet.
# dry_run is left unset, so the workflow posts. The window check ignores the
# clock for workflow_dispatch and still skips if today is already in
# state/last-posted.txt.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-monday.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Daily Quote Tweet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/workflows/daily-tweet.yml/dispatches" \
            -f ref=main
          echo "Dispatched daily-tweet.yml on main with dry_run left at its default (false)."
