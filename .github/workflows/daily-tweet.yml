name: Daily Quote Tweet

on:
  schedule:
    # Hourly 13:17-19:17 UTC covers 6-11 AM Pacific in both PDT and PST.
    # :17 avoids the top-of-hour queue that delays GitHub cron starts.
    # scripts/la-hour.js continues only inside 6-11 AM PT and only if
    # state/last-posted.txt is not already today's Pacific date.
    - cron: '17 13-19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render the card and reel, and log the text. Do not post.'
        type: boolean
        default: false

permissions:
  contents: write   # to commit state/last-posted.txt and state/history.json after a real post

concurrency:
  group: daily-quote
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pacific hour guard
        id: guard
        run: node scripts/la-hour.js

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci

      - name: Ensure ffmpeg
        if: steps.guard.outputs.run == 'true'
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Generate quote image and tweet
        id: tweet
        if: steps.guard.outputs.run == 'true'
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          DRY_RUN: ${{ vars.AXITOME_DRY_RUN == '1' && '1' || ((github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '') }}
        run: node scripts/daily-tweet.js

      # Immediately after the tweet, before reel or artifact steps. if: always()
      # so a later failure still records a tweet that already went out.
      - name: Record posted date
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          if git diff --quiet -- state/last-posted.txt state/history.json && ! git ls-files --others --exclude-standard -- state | grep -q .; then
            echo "No new post recorded (dry run or failure)."
            exit 0
          fi
          git config user.name "axitome-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last-posted.txt state/history.json
          git commit -m "state: posted ${{ steps.guard.outputs.date }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Render vertical reel
        if: steps.guard.outputs.run == 'true'
        run: node scripts/render-reel.js

      - name: Save card, reel, and tweet id
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-quote-${{ github.run_id }}
          retention-days: 90
          path: |
            out/quote-card.png
            out/quote-story.png
            out/quote-reel.mp4
            out/tweet-log.jsonl
